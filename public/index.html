<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivingFish 登录令牌生成</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #00d4ff;
            --primary-hover: #00a8cc;
            --text: #e0e0e0;
            --text-muted: #888;
            --success: #00ff88;
            --error: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #0088cc);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 24px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-box {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 16px;
        }

        .result-box.error {
            background: rgba(255, 71, 87, 0.1);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .result-label {
            font-size: 12px;
            color: var(--success);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-box.error .result-label {
            color: var(--error);
        }

        .token-display {
            word-break: break-all;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            color: var(--text);
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 10px 16px;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.4);
            border-radius: 8px;
            color: var(--success);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .copy-btn:hover {
            background: rgba(0, 255, 136, 0.3);
        }

        .instructions {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .instructions code {
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>🐟 DivingFish</h1>
                <p>生成加密登录令牌</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入水鱼账号" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    生成加密令牌
                </button>
            </form>

            <div class="result" id="result">
                <div class="result-box" id="resultBox">
                    <div class="result-label">
                        <span>✓</span> 令牌生成成功
                    </div>
                    <div class="token-display" id="tokenDisplay"></div>
                    <button class="copy-btn" id="copyBtn" onclick="copyToken()">
                        📋 复制令牌
                    </button>
                </div>
            </div>

            <div class="instructions">
                <strong>使用说明：</strong><br>
                1. 输入你的水鱼查分器账号密码<br>
                2. 点击生成按钮获取加密令牌<br>
                3. 复制令牌后在 Bot 中使用：<br>
                <code>fish.login 你的令牌</code>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        const resultBox = document.getElementById('resultBox');
        const tokenDisplay = document.getElementById('tokenDisplay');
        
        let generatedToken = '';
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>生成中...';
            result.classList.remove('show');
            
            try {
                const response = await fetch('/api/generate-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.token) {
                    generatedToken = data.token;
                    tokenDisplay.textContent = data.token;
                    resultBox.classList.remove('error');
                    resultBox.querySelector('.result-label').innerHTML = '<span>✓</span> 令牌生成成功';
                    document.getElementById('copyBtn').style.display = 'block';
                } else {
                    tokenDisplay.textContent = data.error || '生成失败，请重试';
                    resultBox.classList.add('error');
                    resultBox.querySelector('.result-label').innerHTML = '<span>✗</span> 生成失败';
                    document.getElementById('copyBtn').style.display = 'none';
                }
                
                result.classList.add('show');
            } catch (error) {
                tokenDisplay.textContent = '网络错误，请检查连接后重试';
                resultBox.classList.add('error');
                resultBox.querySelector('.result-label').innerHTML = '<span>✗</span> 生成失败';
                document.getElementById('copyBtn').style.display = 'none';
                result.classList.add('show');
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = '生成加密令牌';
        });
        
        async function copyToken() {
            if (!generatedToken) return;
            
            try {
                await navigator.clipboard.writeText(generatedToken);
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '✓ 已复制';
                setTimeout(() => {
                    copyBtn.textContent = '📋 复制令牌';
                }, 2000);
            } catch (e) {
                const textArea = document.createElement('textarea');
                textArea.value = generatedToken;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = '✓ 已复制';
                setTimeout(() => {
                    copyBtn.textContent = '📋 复制令牌';
                }, 2000);
            }
        }
    </script>
</body>

</html>
